<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đợt đăng ký</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
<main class="page-content">
    <div class="d-flex justify-content-between align-items-center my-3"><h1
            class="h3">Quản lý đợt đăng ký</h1><a class="btn btn-primary"
                                                  href="/periods/create">Tạo đợt
        đăng ký</a></div>
    <div class="alert alert-success" th:if="${successMessage}"
         th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}"
         th:text="${errorMessage}"></div>
    <div class="table-responsive">
        <table class="table table-bordered align-middle">
            <thead>
            <tr>
                <th>Mã</th>
                <th>Tên đợt</th>
                <th>Loại</th>
                <th>Thời gian giảng viên</th>
                <th>Thời gian sinh viên</th>
                <th>Trạng thái</th>
                <th>Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="period : ${periods}">
                <td th:text="${period.periodId}"></td>
                <td th:text="${period.periodName}"></td>
                <td th:text="${period.periodType}"></td>
                <td><span th:text="${period.lecturerStartAt}"></span><br>đến<br><span
                        th:text="${period.lecturerEndAt}"></span></td>
                <td><span
                        th:text="${period.studentStartAt}"></span><br>đến<br><span
                        th:text="${period.studentEndAt}"></span></td>
                <td th:text="${period.status}"></td>
                <td>
                    <form th:if="${period.status == 'DRAFT'}"
                          th:action="@{/periods/{id}/publish(id=${period.periodId})}"
                          method="post"><input type="hidden"
                                               th:name="${_csrf.parameterName}"
                                               th:value="${_csrf.token}">
                        <button class="btn btn-sm btn-success">Công bố</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</div>
</body>
</html>
