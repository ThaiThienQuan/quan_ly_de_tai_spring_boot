<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tạo đợt đăng ký</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
<main class="page-content" style="max-width:1000px"><a href="/periods">← Danh
    sách đợt</a>
    <h1 class="h3 my-3">Tạo đợt đăng ký</h1>
    <div class="alert alert-danger" th:if="${errorMessage}"
         th:text="${errorMessage}"></div>
    <form th:action="@{/periods}" th:object="${period}" method="post"
          class="row g-3"><input type="hidden" th:name="${_csrf.parameterName}"
                                 th:value="${_csrf.token}">
        <div class="col-12"><label class="form-label">Tên đợt</label><input
                class="form-control" th:field="*{periodName}" required
                maxlength="150"></div>
        <div class="col-md-6"><label class="form-label">Loại đợt</label><select
                class="form-select" th:field="*{periodType}" required>
            <option value="MON_HOC">Môn học</option>
            <option value="NCKH">Nghiên cứu khoa học</option>
            <option value="TLCN">Tiểu luận chuyên ngành</option>
            <option value="KLTN">Khóa luận tốt nghiệp</option>
        </select></div>
        <div class="col-md-6"><label class="form-label">Hạn nộp điểm phản biện
            (bắt buộc với tiểu luận và khóa luận)</label><input
                class="form-control" type="datetime-local"
                th:field="*{reviewDeadline}"></div>
        <div class="col-md-6"><label class="form-label">Bắt đầu đăng ký của
            giảng viên</label><input class="form-control" type="datetime-local"
                                     th:field="*{lecturerStartAt}" required>
        </div>
        <div class="col-md-6"><label class="form-label">Kết thúc đăng ký của
            giảng viên</label><input class="form-control" type="datetime-local"
                                     th:field="*{lecturerEndAt}" required></div>
        <div class="col-md-6"><label class="form-label">Bắt đầu đăng ký của sinh
            viên</label><input class="form-control" type="datetime-local"
                               th:field="*{studentStartAt}" required></div>
        <div class="col-md-6"><label class="form-label">Kết thúc đăng ký của
            sinh viên</label><input class="form-control" type="datetime-local"
                                    th:field="*{studentEndAt}" required></div>
        <div class="col-12"><label class="form-label">Ngày báo cáo hội đồng (chỉ
            dành cho khóa luận tốt nghiệp)</label><input class="form-control"
                                                         type="datetime-local"
                                                         th:field="*{councilReportDate}">
        </div>
        <div class="col-12">
            <button class="btn btn-primary">Lưu bản nháp</button>
            <a class="btn btn-secondary" href="/periods">Hủy</a></div>
    </form>
    <p class="text-muted mt-3">Đợt được tạo ở trạng thái bản nháp. Trưởng khoa
        cần công bố riêng sau khi kiểm tra thông tin.</p></main>
</div>
</body>
</html>
