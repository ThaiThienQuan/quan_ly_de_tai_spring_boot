<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thông báo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
<main class="page-content">
    <h1 class="h3 my-3">Thông báo</h1>
    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
    <section th:if="${manager}" class="card card-body mb-4">
        <h2 class="h5">Soạn thông báo chính thức</h2>
        <form th:action="@{/notifications}" method="post" class="row g-2">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="col-md-6"><label class="form-label">Tiêu đề</label><input class="form-control" name="title" maxlength="250" required></div>
            <div class="col-md-3"><label class="form-label">Loại</label>
                <select class="form-select" name="type"><option value="SYSTEM">SYSTEM</option><option value="ACADEMIC">ACADEMIC</option><option value="DEADLINE">DEADLINE</option></select>
            </div>
            <div class="col-md-3"><label class="form-label">Nhóm nhận thông báo</label>
                <select class="form-select" name="targetRoles" multiple required>
                    <option th:each="role : ${roles}" th:value="${role}" th:text="${role}"></option>
                </select>
            </div>
            <div class="col-12"><label class="form-label">Nội dung</label><textarea class="form-control" name="content" rows="4" required></textarea></div>
            <div class="col-12"><button class="btn btn-primary">Lưu bản nháp</button></div>
        </form>
    </section>
    <div class="row g-3">
        <article class="col-12" th:each="notification : ${notifications}">
            <div class="card"><div class="card-body">
                <div class="d-flex justify-content-between">
                    <h2 class="h5" th:text="${notification.title}"></h2>
                    <span class="badge text-bg-secondary" th:text="${notification.status}"></span>
                </div>
                <p class="text-muted" th:text="${notification.type}"></p>
                <p class="mb-2" style="white-space:pre-wrap" th:text="${notification.content}"></p>
                <form th:if="${manager and notification.status == 'DRAFT'}"
                      th:action="@{/notifications/{id}/publish(id=${notification.notificationId})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button class="btn btn-sm btn-success">Đăng tải</button>
                </form>
            </div></div>
        </article>
        <p class="text-muted" th:if="${#lists.isEmpty(notifications)}">Chưa có thông báo dành cho bạn.</p>
    </div>
</main>
</div>
</body>
</html>
