<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tài khoản của tôi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="page-content">
        <h1 class="h3 mb-2">Tài khoản của tôi</h1>
        <p class="text-muted mb-4">Cập nhật thông tin liên hệ của bạn.</p>
        <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
        <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
        <section class="card border-0 shadow-sm" style="max-width:720px">
            <div class="card-body p-4">
                <form th:action="@{/account}" method="post" class="row g-3">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="col-md-6">
                        <label class="form-label">Tên đăng nhập</label>
                        <input class="form-control" th:value="${account.username}" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="fullName">Họ và tên</label>
                        <input id="fullName" class="form-control" name="fullName" th:value="${account.fullName}" maxlength="100" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="email">Email</label>
                        <input id="email" class="form-control" type="email" name="email" th:value="${account.email}" maxlength="100" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="phone">Số điện thoại</label>
                        <input id="phone" class="form-control" name="phone" th:value="${account.phone}" maxlength="20">
                    </div>
                    <div class="col-12 d-flex gap-2">
                        <button class="btn btn-primary">Lưu thông tin</button>
                        <a class="btn btn-outline-secondary" th:href="@{/account/password}">Đổi mật khẩu</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>
</body>
</html>
