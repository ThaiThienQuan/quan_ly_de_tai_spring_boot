<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tạo đề tài</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
<main class="page-content" style="max-width:900px"><a href="/topics">← Danh
    sách đề tài</a>
    <h1 class="h3 my-3">Đăng ký đề tài</h1>
    <div class="alert alert-danger" th:if="${errorMessage}"
         th:text="${errorMessage}"></div>
    <form th:action="@{/topics}" th:object="${topic}" method="post"
          class="row g-3"><input type="hidden" th:name="${_csrf.parameterName}"
                                 th:value="${_csrf.token}">
        <div class="col-md-6"><label class="form-label">Mã đợt đăng
            ký</label><input class="form-control" type="number"
                             th:field="*{periodId}" min="1" required></div>
        <div class="col-md-6"><label class="form-label">Mã bộ môn</label><input
                class="form-control" type="number" th:field="*{departmentId}"
                min="1" required></div>
        <div class="col-md-6"><label class="form-label">Mã đề tài</label><input
                class="form-control" th:field="*{topicCode}" maxlength="30"
                required></div>
        <div class="col-md-6"><label class="form-label">Tên đề tài</label><input
                class="form-control" th:field="*{topicName}" maxlength="200"
                required></div>
        <div class="col-md-6"><label class="form-label">Giảng viên hướng dẫn thứ
            hai (không bắt buộc)</label>
            <select class="form-select" name="coSupervisorId">
                <option value="">Không chọn</option>
                <option th:each="lecturer : ${lecturers}"
                        th:value="${lecturer.lecturerId}"
                        th:text="${lecturer.lecturerCode}"></option>
            </select>
        </div>
        <div class="col-12"><label class="form-label">Mô tả nội
            dung</label><textarea class="form-control" th:field="*{description}"
                                  rows="5"></textarea></div>
        <div class="col-12">
            <button class="btn btn-primary">Gửi phê duyệt</button>
            <a class="btn btn-secondary" href="/topics">Hủy</a></div>
    </form>
    <p class="text-muted mt-3">Giảng viên tạo đề tài được ghi nhận là giảng
        viên hiện diện thứ
        nhất. Mã đợt và mã bộ môn phải tồn tại; tài khoản đăng nhập phải có hồ
        sơ giảng viên.</p></main>
</div>
</body>
</html>
