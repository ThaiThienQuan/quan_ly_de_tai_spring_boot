<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý đề tài</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
<main class="page-content">
    <div class="d-flex justify-content-between align-items-center my-3"><h1
            class="h3">Quản lý đề tài</h1><a th:if="${canCreate}" class="btn btn-primary"
                                             href="/topics/create">Đăng ký đề
        tài mới</a></div>
    <div class="alert alert-success" th:if="${successMessage}"
         th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}"
         th:text="${errorMessage}"></div>
    <div class="table-responsive">
        <table class="table table-bordered align-middle">
            <thead>
            <tr>
                <th>Mã</th>
                <th>Tên đề tài</th>
                <th>Đợt</th>
                <th>Bộ môn</th>
                <th>Trạng thái</th>
                <th>Đã công bố</th>
                <th>Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="topic : ${topics}">
                <td th:text="${topic.topicCode}"></td>
                <td><strong th:text="${topic.topicName}"></strong><br><small
                        th:text="${topic.description}"></small></td>
                <td th:text="${topic.periodId}"></td>
                <td th:text="${topic.departmentId}"></td>
                <td th:text="${topic.status}"></td>
                <td th:text="${topic.published ? 'Có' : 'Không'}"></td>
                <td>
                    <div class="d-flex gap-1">
                        <form th:if="${canReview and topic.status == 'PENDING'}"
                              th:action="@{/topics/{id}/approve(id=${topic.topicId})}"
                              method="post"><input type="hidden"
                                                   th:name="${_csrf.parameterName}"
                                                   th:value="${_csrf.token}">
                            <button class="btn btn-sm btn-warning">Duyệt
                            </button>
                        </form>
                        <form th:if="${canReview and topic.status == 'APPROVED' and !topic.published}"
                              th:action="@{/topics/{id}/publish(id=${topic.topicId})}"
                              method="post"><input type="hidden"
                                                   th:name="${_csrf.parameterName}"
                                                   th:value="${_csrf.token}">
                            <button class="btn btn-sm btn-success">Công bố
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(topics)}">
                <td colspan="7">Chưa có đề tài.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</div>
</body>
</html>
