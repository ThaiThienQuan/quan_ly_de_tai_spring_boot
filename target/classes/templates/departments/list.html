<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý bộ môn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="page-content">
        <div class="d-flex justify-content-between align-items-center my-3">
            <h1 class="h3">Quản lý bộ môn</h1>
            <a class="btn btn-primary" th:href="@{/departments/new}">Thêm bộ môn</a>
        </div>
        <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
        <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
        <div class="table-responsive">
            <table class="table table-bordered table-striped align-middle">
                <thead>
                <tr>
                    <th>Mã bộ môn</th>
                    <th>Tên bộ môn</th>
                    <th>Mô tả</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="department : ${departments}">
                    <td th:text="${department.departmentCode}"></td>
                    <td th:text="${department.departmentName}"></td>
                    <td th:text="${department.description}"></td>
                    <td th:text="${department.status}"></td>
                    <td class="text-nowrap">
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{/departments/edit/{id}(id=${department.departmentId})}">Sửa</a>
                        <form class="d-inline"
                              th:action="@{/departments/delete/{id}(id=${department.departmentId})}"
                              method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-sm btn-outline-danger" type="submit"
                                    onclick="return confirm('Bạn có chắc muốn xóa bộ môn này?')">Xóa</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(departments)}">
                    <td colspan="5" class="text-center">Chưa có bộ môn nào.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
