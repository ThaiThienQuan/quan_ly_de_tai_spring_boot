<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Bộ môn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="page-content">
        <a th:href="@{/departments}">← Danh sách bộ môn</a>
        <h1 class="h3 my-3" th:text="${pageTitle}">Bộ môn</h1>
        <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
        <form th:action="@{/departments/save}" th:object="${department}" method="post"
              class="row g-3" style="max-width: 800px">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" th:field="*{departmentId}">
            <div class="col-md-6">
                <label class="form-label" for="departmentCode">Mã bộ môn</label>
                <input class="form-control" id="departmentCode" th:field="*{departmentCode}"
                       maxlength="20" required>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="departmentName">Tên bộ môn</label>
                <input class="form-control" id="departmentName" th:field="*{departmentName}"
                       maxlength="100" required>
            </div>
            <div class="col-12">
                <label class="form-label" for="description">Mô tả</label>
                <textarea class="form-control" id="description" th:field="*{description}"
                          rows="4" maxlength="500"></textarea>
            </div>
            <div class="col-12">
                <button class="btn btn-primary" type="submit">Lưu bộ môn</button>
                <a class="btn btn-secondary" th:href="@{/departments}">Hủy</a>
            </div>
        </form>
    </main>
</div>
</body>
</html>
