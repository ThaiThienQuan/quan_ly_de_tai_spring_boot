<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đặt lại mật khẩu tài khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="page-content">
        <a th:href="@{/users}" class="text-decoration-none">← Quay lại quản lý tài khoản</a>
        <h1 class="h3 mt-3 mb-2">Đặt lại mật khẩu</h1>
        <p class="text-muted mb-4">Tài khoản: <strong th:text="${account.username}"></strong></p>
        <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
        <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
        <section class="card border-0 shadow-sm" style="max-width:560px">
            <div class="card-body p-4">
                <form th:action="@{/users/{id}/password(id=${account.userId})}" method="post" class="d-grid gap-3">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div>
                        <label class="form-label" for="newPassword">Mật khẩu mới (ít nhất 8 ký tự)</label>
                        <input id="newPassword" class="form-control" type="password" name="newPassword" minlength="8" autocomplete="new-password" required>
                    </div>
                    <div>
                        <label class="form-label" for="confirmPassword">Xác nhận mật khẩu</label>
                        <input id="confirmPassword" class="form-control" type="password" name="confirmPassword" minlength="8" autocomplete="new-password" required>
                    </div>
                    <div>
                        <button class="btn btn-primary">Lưu mật khẩu mới</button>
                        <a class="btn btn-outline-secondary" th:href="@{/users}">Hủy</a>
                    </div>
                </form>
                <p class="small text-muted mt-3 mb-0">Mật khẩu mới có hiệu lực ngay sau khi lưu.</p>
            </div>
        </section>
    </main>
</div>
</body>
</html>
