<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý tài khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="page-content">
        <h1 class="h3 mb-2">Quản lý tài khoản</h1>
        <p class="text-muted mb-4">Cập nhật thông tin, phân quyền, đặt lại mật khẩu hoặc xóa tài khoản.</p>
        <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
        <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
        <div class="table-responsive bg-white shadow-sm">
            <table class="table table-bordered align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Tên đăng nhập</th><th>Họ và tên</th><th>Email</th><th>Điện thoại</th>
                    <th>Vai trò</th><th>Trạng thái</th><th>Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="account : ${users}">
                    <td>
                        <form th:id="'update-' + ${account.userId}" th:action="@{/users/{id}(id=${account.userId})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        </form>
                        <span th:text="${account.username}"></span>
                    </td>
                    <td><input th:attr="form=|update-${account.userId}|" class="form-control form-control-sm" name="fullName" th:value="${account.fullName}" maxlength="100" required></td>
                    <td><input th:attr="form=|update-${account.userId}|" class="form-control form-control-sm" type="email" name="email" th:value="${account.email}" maxlength="100" required></td>
                    <td><input th:attr="form=|update-${account.userId}|" class="form-control form-control-sm" name="phone" th:value="${account.phone}" maxlength="20"></td>
                    <td>
                        <select th:attr="form=|update-${account.userId}|" class="form-select form-select-sm" name="role">
                            <option th:each="role : ${roles}" th:value="${role}" th:text="${role}" th:selected="${role == account.role}"></option>
                        </select>
                    </td>
                    <td>
                        <select th:attr="form=|update-${account.userId}|" class="form-select form-select-sm" name="status">
                            <option value="ACTIVE" th:selected="${account.status == 'ACTIVE'}">ACTIVE</option>
                            <option value="LOCKED" th:selected="${account.status == 'LOCKED'}">LOCKED</option>
                        </select>
                    </td>
                    <td class="text-nowrap">
                        <button th:attr="form=|update-${account.userId}|" class="btn btn-sm btn-primary">Lưu</button>
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/users/{id}/password(id=${account.userId})}">Đặt lại mật khẩu</a>
                        <form th:action="@{/users/{id}/delete(id=${account.userId})}" method="post" class="d-inline"
                              onsubmit="return confirm('Bạn có chắc muốn xóa tài khoản này?');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-sm btn-outline-danger">Xóa</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(users)}"><td colspan="7" class="text-center text-muted">Chưa có tài khoản.</td></tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
