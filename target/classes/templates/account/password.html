<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đổi mật khẩu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="page-content">
        <h1 class="h3 mb-2">Đổi mật khẩu</h1>
        <p class="text-muted mb-4">Nhập mật khẩu hiện tại để xác minh trước khi đổi mật khẩu.</p>
        <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
        <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
        <section class="card border-0 shadow-sm" style="max-width:560px">
            <div class="card-body p-4">
                <form th:action="@{/account/password}" method="post" class="d-grid gap-3">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div>
                        <label class="form-label" for="currentPassword">Mật khẩu hiện tại</label>
                        <input id="currentPassword" class="form-control" type="password" name="currentPassword" autocomplete="current-password" required>
                    </div>
                    <div>
                        <label class="form-label" for="newPassword">Mật khẩu mới (ít nhất 8 ký tự)</label>
                        <input id="newPassword" class="form-control" type="password" name="newPassword" minlength="8" autocomplete="new-password" required>
                    </div>
                    <div>
                        <label class="form-label" for="confirmPassword">Xác nhận mật khẩu mới</label>
                        <input id="confirmPassword" class="form-control" type="password" name="confirmPassword" minlength="8" autocomplete="new-password" required>
                    </div>
                    <div>
                        <button class="btn btn-primary">Cập nhật mật khẩu</button>
                        <a class="btn btn-outline-secondary" th:href="@{/account}">Quay lại tài khoản</a>
                    </div>
                </form>
            </div>
        </section>
        <p class="small text-muted mt-3">Nếu không còn nhớ mật khẩu hiện tại, vui lòng liên hệ quản trị viên để được đặt lại.</p>
    </main>
</div>
</body>
</html>
