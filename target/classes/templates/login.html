<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card mx-auto shadow-sm" style="max-width:440px">
        <div class="card-body p-4"><h1 class="h4 mb-3">Hệ thống quản lý đề
            tài</h1>
            <div class="alert alert-danger" th:if="${param.error}">Tên đăng nhập
                hoặc mật khẩu không đúng.
            </div>
            <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
            <div class="alert alert-success" th:if="${param.logout}">Bạn đã đăng
                xuất.
            </div>
            <form th:action="@{/login}" method="post"><input type="hidden"
                                                             th:name="${_csrf.parameterName}"
                                                             th:value="${_csrf.token}">
                <div class="mb-3"><label class="form-label">Tên đăng
                    nhập</label><input class="form-control" name="username"
                                       required></div>
                <div class="mb-3"><label class="form-label">Mật
                    khẩu</label><input class="form-control" name="password"
                                       type="password" required></div>
                <button class="btn btn-primary w-100">Đăng nhập</button>
            </form>
            <p class="text-center mt-3 mb-0"><a th:href="@{/register}">Tạo tài khoản sinh viên</a></p>
            <p class="text-center text-muted small mt-2 mb-0">Quên mật khẩu? Hãy liên hệ quản trị viên.</p>
        </div>
    </div>
</div>
</body>
</html>
