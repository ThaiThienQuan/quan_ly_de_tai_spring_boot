<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kết quả đề tài</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
<main class="page-content">
    <h1 class="h3 my-3">Kết quả đánh giá đề tài</h1>
    <div class="table-responsive"><table class="table table-bordered">
        <thead><tr><th>Mã nhóm</th><th>Mã đề tài</th><th>Hội đồng</th><th>Điểm trung bình</th><th>Kết quả</th><th>Điểm thành phần và nhận xét</th></tr></thead>
        <tbody>
        <tr th:each="result : ${results}">
            <td th:text="${result.groupId}"></td><td th:text="${result.topicId}"></td>
            <td th:text="${result.councilId}"></td><td th:text="${result.finalScore}"></td><td th:text="${result.result}"></td>
            <td><ul class="mb-0">
                <li th:each="evaluation : ${evaluationsByResult[result.resultId]}">
                    <span th:text="${evaluation.score}"></span>/10 —
                    <span th:text="${evaluation.comment == null ? 'Không có nhận xét' : evaluation.comment}"></span>
                </li>
            </ul></td>
        </tr>
        <tr th:if="${#lists.isEmpty(results)}"><td colspan="6">Chưa có kết quả được công bố cho nhóm của bạn.</td></tr>
        </tbody>
    </table></div>
</main>
</div>
</body>
</html>
