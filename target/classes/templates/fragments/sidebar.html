<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="app-sidebar" th:fragment="sidebar">
    <a class="sidebar-brand" th:href="@{/}">
        <span class="brand-mark">QL</span>
        <span>Quản lý đề tài<small>Hệ thống học vụ</small></span>
    </a>
    <div class="sidebar-user">
        <span class="user-avatar" th:text="${#strings.toUpperCase(#strings.substring(currentUsername, 0, 1))}">U</span>
        <span class="text-truncate" th:text="${currentUsername}">Tài khoản</span>
    </div>
    <nav class="sidebar-nav" aria-label="Điều hướng chính">
        <a th:href="@{/}" class="sidebar-link"><span>⌂</span> Trang chủ</a>
        <a th:if="${canManagePeriods}" th:href="@{/periods}" class="sidebar-link"><span>▦</span> Đợt đăng ký</a>
        <a th:href="@{/topics}" class="sidebar-link"><span>◈</span> Đề tài</a>
        <a th:if="${canManageGroups}" th:href="@{/groups}" class="sidebar-link"><span>♧</span> Nhóm sinh viên</a>
        <a th:if="${canManageReviews}" th:href="@{/reviews}" class="sidebar-link"><span>✓</span> Hội đồng &amp; đánh giá</a>
        <a th:if="${canViewResults}" th:href="@{/reviews/results}" class="sidebar-link"><span>▤</span> Kết quả đánh giá</a>
        <a th:href="@{/notifications}" class="sidebar-link"><span>◉</span> Thông báo</a>
        <a th:if="${canManageUsers}" th:href="@{/users}" class="sidebar-link"><span>♙</span> Quản lý tài khoản</a>
        <a th:href="@{/account}" class="sidebar-link"><span>⚙</span> Tài khoản của tôi</a>
    </nav>
    <form class="sidebar-logout" th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit"><span>↪</span> Đăng xuất</button>
    </form>
</aside>
</body>
</html>
